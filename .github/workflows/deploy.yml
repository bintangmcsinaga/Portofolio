
name: Deploy Portofolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Server
        run: |
          mkdir -p /var/www/app/Portofolio/dist
          rsync -av --delete dist/ /var/www/app/Portofolio/dist/
